name: Build Nova Video APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project archive
        run: unzip -q NovaVideo-Complete-MobileBuild.zip -d extracted

      - name: Build debug APK
        run: gradle -p extracted/novavideo assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaVideo-APK
          path: extracted/novavideo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
